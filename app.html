<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Solvento v2</title>
  <link rel="icon" href="img/logo-solvento.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0f1115; color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    input {
      width: 100%; background: #12141d; border: 1px solid #2a2d3a; border-radius: 10px;
      color: #e5e7eb; font-size: 0.95rem; padding: 0.8rem 1rem; outline: none;
      font-family: inherit; margin-bottom: 0.75rem; transition: border-color 0.15s;
    }
    input:focus { border-color: #6b7280; }
    button.primary {
      width: 100%; background: #ffffff; border: none; border-radius: 10px; color: #000;
      font-size: 0.95rem; font-weight: 700; padding: 0.8rem 1rem; cursor: pointer;
      font-family: inherit; transition: opacity 0.15s;
    }
    button.primary:hover { opacity: 0.85; }
    .boot-panel { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; }
    .boot-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; margin: 1rem 0 0.35rem; }
    .boot-sub { font-size: 0.82rem; color: #6b7280; margin-bottom: 1.75rem; text-align: center; }
    .boot-err { display: none; font-size: 0.82rem; font-weight: 600; margin-top: 1rem; text-align: center; }
    .card {
      max-width: 1100px; margin: 0 auto; background: #171a24; border: 1px solid #232733;
      border-radius: 14px; padding: 1.5rem;
    }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
    .stat { background: #12141d; border: 1px solid #232733; border-radius: 10px; padding: 1rem 1.25rem; }
    .stat b { display: block; font-size: 1.8rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .stat span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; padding: 0.6rem 0.9rem; color: #6b7280; font-size: 0.72rem;
         text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #2a2d3a; }
  </style>
</head>
<body>

<!-- ══ ARRANQUE: login (descifra) / importación inicial ══ -->
<div id="boot-overlay" style="position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem;">

  <!-- Login (ya existe un bloque cifrado en este dispositivo) -->
  <form id="login-form" class="boot-panel" style="display:none;">
    <img src="img/logo-solvento.png" alt="" style="width:56px;height:56px;object-fit:contain;" />
    <div class="boot-title">Solvento</div>
    <div class="boot-sub">Introduce tu contraseña para descifrar tus datos</div>
    <input id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password" />
    <button type="submit" class="primary">Desbloquear</button>
    <div id="login-error" class="boot-err"></div>
  </form>

  <!-- Importación inicial (primera vez en este dispositivo) -->
  <form id="import-form" class="boot-panel" style="display:none;">
    <img src="img/logo-solvento.png" alt="" style="width:56px;height:56px;object-fit:contain;" />
    <div class="boot-title">Configura tu cifrado</div>
    <div class="boot-sub">
      Primera vez en este dispositivo. Elige una contraseña: cifrará todos tus datos
      en este navegador. <b style="color:#e5e7eb;">Si la pierdes, no hay forma de recuperar los datos.</b>
    </div>
    <input id="imp-pass" type="password" placeholder="Nueva contraseña (mín. 6)" autocomplete="new-password" />
    <input id="imp-pass2" type="password" placeholder="Repite la contraseña" autocomplete="new-password" />
    <button type="submit" class="primary">Cifrar y entrar</button>
    <div id="imp-error" class="boot-err"></div>
  </form>
</div>

<!-- ══ APP (solo-lectura, mínima — el render completo es Fase 2) ══ -->
<div id="app" style="display:none;padding:1.5rem;">
  <div style="max-width:1100px;margin:0 auto 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;">
    <div style="display:flex;align-items:center;gap:0.6rem;">
      <img src="img/logo-solvento.png" alt="" style="width:26px;height:26px;object-fit:contain;" />
      <div>
        <div style="font-weight:800;font-size:1.05rem;">Solvento <span style="color:#6b7280;font-weight:600;font-size:0.8rem;">v2 · vista previa</span></div>
        <div style="font-size:0.72rem;color:#10b981;">🔓 Datos descifrados en este navegador</div>
      </div>
    </div>
    <button id="lock-btn" class="primary" style="width:auto;background:none;border:1px solid #2a2d3a;color:#9ca3af;">🔒 Bloquear</button>
  </div>

  <div id="app-content"></div>
</div>

<script src="src/js/crypto.js"></script>
<script src="src/js/config.js"></script>
<script src="src/js/model.js"></script>
<script src="src/js/render.js"></script>
<script src="src/js/db.js"></script>
<script src="src/js/boot.js"></script>
</body>
</html>

name: Actualizar precios Solvento

# v2: el sitio es una app cifrada estática (index.html + src/js). Este workflow
# ya NO reconstruye HTML ni descarga Google Sheets; solo refresca prices.json
# (precios públicos en EUR) para que la web valore la cartera. Los datos
# personales viven cifrados en los *-data.enc y NUNCA los toca este workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*-data.enc"         # los guardados cifrados no cambian el código
      - "prices.json"   # evita re-disparo por el propio commit de precios
      - "fundamentals.json"
  schedule:
    - cron: "59 23 * * *"  # todos los días a las 23:59 UTC

permissions:
  contents: write

# Cada push dispara este workflow, así que dos empujones seguidos lanzaban dos
# ejecuciones que competían por escribir prices.json: la segunda se encontraba la
# rama movida y su push moría. Con esto van en fila de a una.
concurrency:
  group: precios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar fallo por email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{secrets.MAIL_USERNAME}}
          password: ${{secrets.MAIL_PASSWORD}}
          subject: "⚠️ Solvento — fallo al actualizar precios (${{github.run_id}})"
          to: acasadovadillo@gmail.com
          from: Finanzas Personales Bot
          body: |
            El workflow "Actualizar precios Solvento" ha fallado.

            Repositorio: ${{github.repository}}
            Run ID: ${{github.run_id}}

            Ver detalles: https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}

      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Generar prices.json
        run: python tools/build_prices.py

      - name: Descargar fundamentales (si hay clave)
        # Sin el secreto configurado el script avisa y sale sin error, para que
        # los precios se publiquen igual.
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python tools/build_fundamentals.py

      - name: Validar prices.json
        run: |
          BYTES=$(wc -c < prices.json)
          echo "prices.json — $BYTES bytes"
          if [ "$BYTES" -lt 10000 ]; then
            echo "❌ prices.json demasiado pequeño ($BYTES bytes) — descarga incompleta"
            exit 1
          fi
          python -c "import json; d=json.load(open('prices.json')); assert d.get('eur') and d.get('hist'), 'faltan claves'; print('✅ prices.json válido')"

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json fundamentals.json 2>/dev/null || git add prices.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
            exit 0
          fi
          git commit -m "Actualizar precios $(date +%Y-%m-%d)"
          # El push puede fallar por dos motivos que no son culpa de nadie: que
          # la rama se haya movido mientras corría el trabajo, o que GitHub
          # conteste con un 500. Los dos se arreglan volviéndolo a intentar
          # después de traerse lo nuevo, así que se reintenta antes de dar el
          # trabajo por fallido y mandar un correo de alarma.
          for intento in 1 2 3; do
            if git push; then
              echo "Publicado a la $intento"
              exit 0
            fi
            echo "Push rechazado (intento $intento); reintento tras traer la rama"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((intento * 5))
          done
          echo "::error::No se pudo publicar prices.json tras tres intentos"
          exit 1

name: Actualizar precios Solvento

# v2: el sitio es una app cifrada estática (index.html + src/js). Este workflow
# ya NO reconstruye HTML ni descarga Google Sheets; solo refresca prices.json
# (precios públicos en EUR) para que la web valore la cartera. Los datos
# personales viven cifrados en data.enc y NUNCA los toca este workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data.enc"      # los guardados cifrados del usuario no disparan rebuild
      - "prices.json"   # evita re-disparo por el propio commit de precios
  schedule:
    - cron: "59 23 * * *"  # todos los días a las 23:59 UTC

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar fallo por email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{secrets.MAIL_USERNAME}}
          password: ${{secrets.MAIL_PASSWORD}}
          subject: "⚠️ Solvento — fallo al actualizar precios (${{github.run_id}})"
          to: acasadovadillo@gmail.com
          from: Finanzas Personales Bot
          body: |
            El workflow "Actualizar precios Solvento" ha fallado.

            Repositorio: ${{github.repository}}
            Run ID: ${{github.run_id}}

            Ver detalles: https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}

      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Generar prices.json
        run: python tools/build_prices.py

      - name: Validar prices.json
        run: |
          BYTES=$(wc -c < prices.json)
          echo "prices.json — $BYTES bytes"
          if [ "$BYTES" -lt 10000 ]; then
            echo "❌ prices.json demasiado pequeño ($BYTES bytes) — descarga incompleta"
            exit 1
          fi
          python -c "import json; d=json.load(open('prices.json')); assert d.get('eur') and d.get('hist'), 'faltan claves'; print('✅ prices.json válido')"

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "Sin cambios en prices.json"
          else
            git commit -m "Actualizar precios $(date +%Y-%m-%d)"
            git push
          fi
